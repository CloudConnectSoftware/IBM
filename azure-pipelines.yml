#This is a test 
trigger:
- main
- master

variables:
  BRANCH_NAME: $[replace(variables['Build.SourceBranch'], 'refs/heads/', '')]
  isMainBranch: ${{ or(eq(variables['build.SourceBranchName'], 'master'), eq(variables['build.SourceBranchName'], 'main')) }}
  isPR: ${{ eq(variables['build.reason'], 'PullRequest') }}

pool:
  vmImage: windows-latest
  name: Azure Pipelines
  demands:
    - rulesagent

lockBehavior: sequential
stages:
- stage: SetupArtifact
  jobs:
  - job: DoThings
    condition: ne(variables['isPR'], 'true')  # Run the job when isPR is false
    steps:
      - checkout: self
        clean: true
        persistCredentials: true

      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: |
            # Write your PowerShell commands here.
            Write-Host "Hello World"
            Write-Host "Source Branch:" $(Build.SourceBranchName)
            Write-Host "Branch:" $(BRANCH_NAME)
            $result=$(git diff-tree --no-commit-id --name-status -c -r $(Build.SourceVersion))
            Write-Host $result
            $sourceBranch = $env:BUILD_SOURCEBRANCH
            if ($env:BUILD_REASON -eq "PullRequest") 
            {
              # Extract the pull request number from the source branch
              $pullRequestNumber = ($sourceBranch -split '/')[2]
              git fetch origin $sourceBranch
              Write-Host "pullRequestNumber:"  $pullRequestNumber
              # Get the list of changed files in the pull request
              $result = git diff --name-status origin/master..$sourceBranch
              Write-Host "changedFiles:"  $result
              } 
              else 
              {
                # Get the list of changed files in the current branch/commit
                $result = git diff --name-status HEAD^ HEAD
                #$result=$(git diff --name-only $(Build.SourceBranch))
                Write-Host "Result:"   $result
              }

              Write-Host "Git Result :" $result

            if(!([string]::IsNullOrEmpty($result)))
            {
              $array=$Result.Split([System.Environment]::NewLine)
              Write-Host $($array)

              md $(Build.ArtifactStagingDirectory)/temp
              md $(Build.ArtifactStagingDirectory)/tempdelete
              Write-Host "Hello World2"

              foreach ($ele in $array)
              {
                $fileToDelete = ""
                if($file.StartsWith("R") -eq 1)
                {
                  Write-Host "Name change detected"
                  $renameArray = $file.Split("	")
                  $file = "A " + $renameArray[2]
                  $fileToDelete = "D " + $renameArray[1]
                  Write-Host "File to add " + $file
                  Write-Host "File to delelte " + $fileToDelete
                }
                if ($file.StartsWith("M") -eq 1 -Or $file.StartsWith("A") -eq 1 -Or $file.StartsWith("C") -eq 1 -Or $file.StartsWith("T") -eq 1)
                {
                  $fileName=$file.Substring(2)
                  Write-Host "About to Find Source"
                  $source="$(Build.SourcesDirectory)" + "\" + $fileName
                  Write-Host $source
                  $destination="$(Build.ArtifactStagingDirectory)/temp" + "/" + $fileName
                  $destination=$destination.Replace("/","\")
                  $destination=$destination.Replace("\00", "")
                  Write-Host "Destination Found" $destination
                  New-Item $destination -type file -Force
                  Write-Host $destination
                  Copy-Item -Path $source -Destination $destination
                  $file = $fileToDelete
                }
                if ($ele.StartsWith("D") -eq 1)
                {
                  try
                  {
                    $fileName="$ele.Substring(2)"
                    az storage blob delete -c "abc" -n "Rules\IBM\$fileName" --connection-string "$(connectionString)"
                  }
                  catch
                  {
                    Write-Host "Attempted deletion failed"
                  }
                }
              }
              az storage blob upload-batch -s $(Build.ArtifactStagingDirectory)/temp -d "rulescontainer/Rules/IBM" --overwrite --connection-string "$(connectionString)"
            }